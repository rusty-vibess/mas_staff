# TurtleBot3 bringup settings for v1.1.0.

# SFE download API URI.
REMOTE_FILE_EXCHANGE_DOWNLOAD_API_URI=https://sfe.rustlabs.co/api/files/download/

# SFE file ID for the requested distro. Leave blank to build locally.
case "${1:-}" in
  jazzy) REMOTE_FILE_EXCHANGE_FILE_ID= ;;
  humble) REMOTE_FILE_EXCHANGE_FILE_ID=Dka8b0CgDPmku5N ;;
esac
