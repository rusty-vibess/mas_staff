# initial dependency definitions; make export records a versioned snapshot
TARGET_CODENAME=trixie
TARGET_ARCH=arm64

PREREQUISITE_PACKAGES=(
  ca-certificates
  curl
  wget
  bzip2
  libc6:armhf
)

DOCKER_PACKAGES=(
  docker-ce
  docker-ce-cli
  containerd.io
  docker-buildx-plugin
  docker-compose-plugin
  vim
)

# bootstrap records the resolved commit and checksum for make export
OPENCR_REF=master
OPENCR_SHA256=
